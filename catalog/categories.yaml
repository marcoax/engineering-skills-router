# Engineering phases. Listed in the order they normally run in a workflow.
categories:
  requirements:        Clarify intent, scope and unresolved decisions with the user.
  clarification:       Resolve a single ambiguity without a full interview.
  discovery:           Explore unfamiliar territory (code, docs, prior decisions) before deciding.
  code-understanding:  Explain how existing code works or why it is shaped that way.
  research:            Gather facts from external primary sources.
  prototype:           Build a throwaway artifact to answer a design question.
  architecture:        Decide module shape, interfaces and boundaries before code.
  specification:       Write down the expected behavior and boundaries.
  issue-tracking:      Publish specs or tickets to the issue tracker (GitHub, GitLab, local).
  planning:            Break work into ordered, implementable tasks.
  multi-session:       Plan work too large for a single agent session.
  implementation:      Write the code.
  testing:             Drive or verify behavior with tests.
  debugging:           Find and fix the root cause of a failure.
  refactoring:         Restructure code without changing behavior.
  performance:         Measure and improve speed or resource use.
  security:            Audit and harden against vulnerabilities.
  review:              General review of a finished change.
  independent-review:  Adversarial or blast-radius review with a different purpose than the general review.
  framework-review:    Review against the target project's own best practices (project skills only).
  documentation:       Record decisions, ADRs and docs.
  pull-request:        Open or describe a pull request.
  release:             Prepare a production launch.
  setup:               One-time repo configuration a skill depends on.

  # Supporting tasks, selected when needed rather than added to the default flow.
  communication:       Explain a response or report progress and pending decisions plainly.
  learning:            Teach a concept or skill through lessons and practice.
  retrospective:       Extract durable improvements from a completed session or repeated mistakes.
  context-management:  Recover, curate or hand off the context needed for agent work.
  workflow-selection:  Run an explicitly requested vendor orchestrator.
  skill-authoring:     Create or improve reusable instructions and verification skills.
