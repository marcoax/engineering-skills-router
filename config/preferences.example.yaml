# Copy to config/preferences.yaml (git-ignored) to customise routing.
# Preferences pick WHICH suitable skill fills a phase; they never add or remove phases.

preferences:

  # Per-phase preferred skills, tried before the catalog ranking.
  review:
    prefer: [addyosmani/code-review-and-quality]

  testing:
    prefer: [mattpocock/tdd]

  # Per-phase model family for steps run in a subagent (default: primary).
  implementation:
    model: claude

  # Skills never to select.
  exclude:
    - pstack/interrogate

  # Days between update-check prompts at startup (default 14, 0 = never ask).
  update_check_days: 14

  # The two model families, as provider/model-id. Steps run on `primary`;
  # review 2 runs on the family opposite to review 1.
  models:
    claude: claude-bridge/claude-opus-5-5
    openai: openai-codex/gpt-6-sol
  primary: claude
