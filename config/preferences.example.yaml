# Copy to ~/.config/engineering-skills-router/preferences.yaml (or $ENGINEERING_ROUTER_CONFIG/;
# config/preferences.yaml in a clone also works) to customise routing. docs/configuration.md;
# scripts/config prints which file is in effect.
# Preferences pick WHICH suitable skill fills a phase; they never add or remove phases.

preferences:

  # Per-phase preferred skills: the selector picks one when it fits the task.
  review:
    prefer: [addyosmani/code-review-and-quality]

  testing:
    prefer: [mattpocock/tdd]

  # Per-phase model family for steps run in a subagent (default: primary).
  implementation:
    model: claude

  # Skills never to select.
  exclude: []

  # Folder holding your own skills, listed in personal-skills.yaml beside this file
  # (see config/personal-skills.example.yaml). A leading ~ is your home dir; a relative
  # path resolves against this file's directory (the checkout for config/preferences.yaml).
  # personal_path: ~/my-skills

  # Days after which the workflow proposal notes that the vendor update check is due
  # (default 14, 0 = never). It is never asked as a question at startup.
  update_check_days: 14

  # Tokens of session context above which the router, at a step boundary,
  # asks whether to continue or pause (default 150000, 0 = never ask).
  context_threshold: 150000

  # The two model families, as provider/model-id. Steps run on the run's
  # primary family, which a new run takes from `primary` (when set, a harness
  # that can run both families does not ask; the reply `primary <family>` changes it);
  # review 2 runs on the family opposite to review 1. The provider part
  # (claude-bridge, openai-codex) is a local name: set it to the provider ID
  # your harness uses, or subagents will fail to start. A harness that cannot
  # reach the other family can only skip review 2 or run it on its own model.
  # In Claude Code with the panel mod (adapters/claude-code), the other family
  # runs through a local CLI: openai-codex/<model> runs Codex, and
  # opencode/<provider>/<model> runs opencode with any provider it is set up for.
  # /router-models overrides backend, model and effort for that review.
  models:
    claude: claude-bridge/claude-opus-5-5
    openai: openai-codex/gpt-6-sol
  # primary: claude

  # Thinking level of every step subagent: low | medium | high (default: the harness's).
  # effort: medium
